<style>
/* ═══════ 송쌤과학 중1 가상실험실 공통 껍데기 (체험버전 V2.11) ═══════
   ① 테마와 무관한 토큰 → ② 테마 토큰(두 블록, 같은 목록) → ③ 마감 기본층 → ④ 껍데기 부품
   실험실마다 달라지는 장면 토큰·배치는 각 실험실 src/app.css에 둔다. */
:root{
  --font-ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-title:var(--font-ui);
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;
  --r-1:6px;--r-2:10px;--r-3:16px;--r-full:999px;        /* 작은 컨트롤 6 · 버튼·입력 10 · 패널·장면 16 · 상태 알약 full */
  --control-h:36px;--icon-size:18px;
  --dur-fast:140ms;--dur-ui:260ms;--dur-ui-out:180ms;--dur-layout:360ms;
  --ease-out:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.4,0,1,1);--lift:8px;
  --top-h:56px;--strip-h:0px;
  --light-angle:215deg;                                   /* 주 광원: 왼쪽 위 — UI 그림자는 오른쪽 아래로 */
  --brand-pink:#FFB7B2;--brand-ink:#3b1d1b;
  --yt-red:#ff0033;--yt-play:#ffffff;--ig-1:#feda75;--ig-2:#fa7e1e;--ig-3:#d62976;--ig-4:#4f5bd5;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-0:#0b131d;--surface-1:#101b28;--surface-2:#182636;
  --stage:#0e1a27;--stage-2:#132233;
  --text-1:#e8eff5;--text-2:#b0c0cf;--text-3:#8ea2b4;--line-1:#223445;--line-2:#34495d;
  --accent:#6fd3c1;--accent-strong:#9be7d9;--accent-soft:#163a3b;--on-accent:#08131c;--focus:#9be7d9;--scrim:#02070dcc;
  --danger:#ff9d8a;--danger-soft:#3b2322;--ok:#7ed7a0;--ok-soft:#1d3b32;--warn:#ffcf5c;--warn-soft:#3f3822;
  --data-1:#E69F00;--data-2:#56B4E9;--data-3:#2fbf92;--data-4:#CC79A7;
  --shadow-color:215 45% 3%;
  --shadow-1:0 0 #0000;
  --shadow-2:0 12px 32px -12px hsl(var(--shadow-color) / .6);
  --shadow-3:0 24px 64px -16px hsl(var(--shadow-color) / .7);
  --edge-hi:inset 0 1px 0 hsl(0 0% 100% / .06);
}
:root[data-theme="light"]{
  color-scheme:light;
  --surface-0:#edf1f4;--surface-1:#fbfcfd;--surface-2:#e3eaf0;
  --stage:#f5f8fa;--stage-2:#e9eff4;
  --text-1:#132a3b;--text-2:#44596b;--text-3:#566b7e;--line-1:#d3dde5;--line-2:#b2c3d0;
  --accent:#0f6b60;--accent-strong:#0a5148;--accent-soft:#d5eeea;--on-accent:#ffffff;--focus:#0a5148;--scrim:#0b1a2680;
  --danger:#b3261e;--danger-soft:#fbe3df;--ok:#1d7a47;--ok-soft:#d8f0e2;--warn:#8a5a00;--warn-soft:#fff2c8;
  --data-1:#B07400;--data-2:#0072B2;--data-3:#007A5A;--data-4:#A6508A;
  --shadow-color:210 30% 22%;
  --shadow-1:0 1px 2px hsl(var(--shadow-color) / .08);
  --shadow-2:0 1px 2px hsl(var(--shadow-color) / .06),0 10px 28px -10px hsl(var(--shadow-color) / .22);
  --shadow-3:0 2px 6px hsl(var(--shadow-color) / .08),0 24px 56px -16px hsl(var(--shadow-color) / .30);
  --edge-hi:0 0 #0000;
}
/* ③ 마감 기본층 (§6.8) */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;accent-color:var(--accent)}
body{margin:0;background:var(--surface-0);color:var(--text-1);font:400 15px/1.65 var(--font-ui);font-synthesis:none;word-break:keep-all;overflow-wrap:break-word}
:root[data-theme="dark"] body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p,li,figcaption{text-wrap:pretty}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px,1em)}
button,a,[role="button"]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:color-mix(in oklab,var(--accent) 30%,transparent)}
input,textarea{caret-color:var(--accent)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.scroll{overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.num{font-variant-numeric:tabular-nums}
.unit{white-space:nowrap}
img,canvas,video{display:block;max-width:100%}
[hidden]{display:none!important}
dialog:not([open]){display:none}
[popover]:not(:popover-open){display:none}
.sr-only{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:90;padding:8px 12px;border-radius:var(--r-1);background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600}
.skip:focus{top:8px}
kbd{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:3px 5px;color:var(--text-1);background:var(--surface-0)}
svg.ic{width:var(--icon-size);height:var(--icon-size);fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--text-2)}
/* ⑤ 사용자 설정 존중 */
@media (prefers-reduced-motion:reduce){:root{--lift:0px}}
@media (prefers-contrast:more){:root[data-theme]{--line-1:var(--line-2);--text-3:var(--text-2)}}
@media (prefers-reduced-transparency:reduce){.glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--surface-1)!important}}

/* ═══ 몸체: 상단 막대 / 본문 / (휴대폰) 브랜드 띠 ═══ */
html,body{height:100%}
body{height:100dvh;display:grid;grid-template-rows:var(--top-h) minmax(0,1fr) var(--strip-h);overflow:hidden}
.topbar{position:relative;z-index:30;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;background:var(--surface-1);border-bottom:1px solid var(--line-1);min-width:0}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.brandmark{width:27px;height:27px;border-radius:var(--r-2);background:var(--brand-pink);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brandmark svg.ic{width:17px;height:17px;stroke-width:2}
.word{font:700 13px/1 var(--font-ui);color:var(--text-1)}
.vdiv{width:1px;height:15px;background:var(--line-2);flex:none}
.social{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-1);color:var(--text-2);text-decoration:none;flex:none}
.social::before{content:'';position:absolute;inset:-5px}
.social svg{width:21px;height:21px}
.social .yt-body{fill:currentColor}.social .yt-play{fill:var(--surface-1)}
.social .ig-line{fill:none;stroke:currentColor;stroke-width:2}.social .ig-dot{fill:currentColor}
.social:is(:hover,:focus-visible) .yt-body{fill:var(--yt-red)}.social:is(:hover,:focus-visible) .yt-play{fill:var(--yt-play)}
.social:is(:hover,:focus-visible) .ig-line{stroke:url(#ig-grad)}.social:is(:hover,:focus-visible) .ig-dot{fill:var(--ig-3)}
.top-title{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 auto}
.top-title h1{font:700 15px/1.2 var(--font-ui);color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top-title .std{font:500 12px/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.utilities{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.hsep{width:1px;height:20px;background:var(--line-1);margin:0 4px}
.icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:var(--r-2);background:transparent;color:var(--text-2);cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-fast)}
.icon-btn::before{content:'';position:absolute;inset:-4px}
.icon-btn svg.ic{width:20px;height:20px}
.icon-btn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.icon-btn:hover,.social:hover{background:var(--surface-2);color:var(--text-1)}}
main.app{position:relative;min-width:0;min-height:0;overflow:hidden;outline:none}

/* ═══ 버튼 계층: Primary / Secondary / Ghost / Icon ═══ */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--control-h);padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-1);color:var(--text-1);font:600 13px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap;transition:background var(--dur-fast),border-color var(--dur-fast),transform var(--dur-fast)}
.btn::before{content:'';position:absolute;inset:-4px 0}
.btn svg.ic{width:17px;height:17px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
.btn.wide{width:100%}
.btn[aria-disabled="true"],.btn:disabled{opacity:.5;cursor:not-allowed}
@media (hover:hover) and (pointer:fine){
  .btn:not(.primary):not(:disabled):hover{background:var(--surface-2)}
  .btn.primary:not(:disabled):hover{background:var(--accent-strong);border-color:var(--accent-strong)}
  .btn.ghost:hover{color:var(--text-1)}
}
/* 칩 · 세그먼트 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-full);background:transparent;color:var(--text-1);font:500 13px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
.chip::before{content:'';position:absolute;inset:-6px -2px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text-1);font-weight:700}
.chip[aria-pressed="true"]::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);order:-1}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:var(--r-2);background:var(--surface-2);border:1px solid var(--line-1)}
.seg button{position:relative;min-height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font:600 13px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap}
.seg button::before{content:'';position:absolute;inset:-6px -1px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface-1);color:var(--text-1);font-weight:800;box-shadow:var(--edge-hi),0 1px 2px hsl(var(--shadow-color) / .18)}
@media (hover:hover) and (pointer:fine){.chip:hover{border-color:var(--text-2)}.seg button:not([aria-pressed="true"]):not([aria-selected="true"]):hover{color:var(--text-1)}}

/* 결과 저장 — 장면 모서리의 카메라 (Ghost/Icon 계층) */
.save-btn{position:relative;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px 0 9px;border:1px solid var(--line-2);border-radius:var(--r-2);background:color-mix(in oklab,var(--surface-1) 88%,transparent);color:var(--text-1);font:600 13px/1 var(--font-ui);cursor:pointer;white-space:nowrap;box-shadow:var(--edge-hi)}
.save-btn::before{content:'';position:absolute;inset:-5px}
.save-btn svg.ic{width:18px;height:18px}
.save-btn[aria-busy="true"]{opacity:.6;cursor:progress}
@media (hover:hover) and (pointer:fine){.save-btn:hover{background:var(--surface-2)}}
.shutter{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:shutter .32s var(--ease-out);z-index:5;border-radius:inherit}
@keyframes shutter{0%{opacity:.55}100%{opacity:0}}

/* 판독값 — 라벨 · 큰 수 · 작은 단위 */
.readout{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.readout .v{font:800 26px/1.05 var(--font-ui);letter-spacing:-.02em;color:var(--text-1)}
.readout .u{font:600 13px/1 var(--font-ui);color:var(--text-2)}
.lbl{font:600 12px/1.4 var(--font-ui);color:var(--text-2)}

/* 슬라이더 (네이티브 range + accent-color, 트랙 4px 이상 · 터치 44px) */
input[type="range"]{width:100%;height:44px;margin:0;background:transparent;cursor:pointer;touch-action:pan-y}

/* ═══ 대화상자 · 드로어 · 토스트 ═══ */
dialog{border:0;padding:0;color:var(--text-1);background:var(--surface-1)}
dialog::backdrop{background:var(--scrim)}
.modal{width:min(620px,calc(100vw - 32px));max-height:min(86dvh,760px);border-radius:var(--r-3);box-shadow:var(--edge-hi),var(--shadow-3)}
.modal[open]{display:flex;flex-direction:column}
.modal.narrow{width:min(420px,calc(100vw - 32px))}
.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:clamp(360px,32vw,460px);border-left:1px solid var(--line-1);box-shadow:var(--shadow-3)}
.drawer[open]{display:flex;flex-direction:column}
.drawer::backdrop{background:color-mix(in oklab,var(--scrim) 55%,transparent)}
.dialog-head{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 20px;border-bottom:1px solid var(--line-1);flex:none}
.dialog-head h2{font:800 18px/1.3 var(--font-ui);margin-right:auto}
.dialog-body{padding:16px 20px 22px;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
:is(dialog,[popover]).sheet{opacity:0;transform:translateY(var(--lift));transition:opacity var(--dur-ui-out) var(--ease-in),transform var(--dur-ui-out) var(--ease-in),overlay var(--dur-ui-out) allow-discrete,display var(--dur-ui-out) allow-discrete}
:is(dialog[open],[popover]:popover-open).sheet{opacity:1;transform:none;transition-duration:var(--dur-ui);transition-timing-function:var(--ease-out)}
@starting-style{:is(dialog[open],[popover]:popover-open).sheet{opacity:0;transform:translateY(var(--lift))}}
.drawer.sheet{transform:translateX(24px)}
.drawer.sheet[open]{transform:none}
@starting-style{.drawer.sheet[open]{transform:translateX(24px)}}
@media (prefers-reduced-motion:reduce){.drawer.sheet,.drawer.sheet[open]{transform:none}}
.help-doc h3{font:700 15px/1.4 var(--font-ui);margin:18px 0 6px;color:var(--text-1)}
.help-doc h3:first-child{margin-top:0}
.help-doc p,.help-doc li{font-size:15px;line-height:1.7;color:var(--text-1)}
.help-doc ul,.help-doc ol{margin:0;padding-left:20px}
.help-doc li+li{margin-top:4px}
.help-doc .keys{line-height:2.2}
.brandblock{margin-top:16px;padding:12px 14px;border-radius:var(--r-2);background:var(--surface-2);font-size:13px;line-height:1.8;color:var(--text-1)}
.brandblock a{color:var(--text-1)}
.ver-line{margin-top:10px;font:500 12px/1 var(--font-ui);color:var(--text-2)}
/* 원리 카드 */
.tcard{padding:0 0 18px;border-bottom:1px solid var(--line-1);margin-bottom:18px}
.tcard:last-child{border-bottom:0;margin-bottom:0}
.tcard h3{font:800 18px/1.35 var(--font-ui);margin:0 0 8px}
.tcard figure{margin:0 0 10px;border-radius:var(--r-2);background:var(--stage);border:1px solid var(--line-1);overflow:hidden}
.tcard figure svg{display:block;width:100%;height:auto}
.tcard .def{font:700 15px/1.6 var(--font-ui);margin-bottom:6px}
.tcard p{font-size:15px;line-height:1.7;color:var(--text-1)}
.tcard p+p{margin-top:6px}
.tcard .tb-list{margin:4px 0 0;padding:0 0 0 18px;display:grid;gap:5px}
.tcard .tb-list li{font-size:14px;line-height:1.6;color:var(--text-1)}
.tcard .tb-list b{font-weight:800}
.tcard .link{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-1) var(--r-1) 0;font-size:15px;line-height:1.65}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--strip-h) + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;max-width:min(360px,calc(100vw - 24px));padding:10px 14px;border-radius:var(--r-2);background:var(--surface-1);border:1px solid var(--line-2);box-shadow:var(--edge-hi),var(--shadow-2);font:500 13px/1.5 var(--font-ui);color:var(--text-1)}
.toast.error{border-color:var(--danger)}
.toast .toast-x{flex:none;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:var(--r-1);background:transparent;color:var(--text-2);cursor:pointer}
.textlink{display:inline-flex;align-items:center;gap:6px;color:var(--text-1);font:600 13px/1 var(--font-ui);text-decoration:underline;text-underline-offset:3px;padding:10px 0}
.textlink .yt-ic{width:20px;height:20px;stroke:none}
.textlink .yt-ic .yt-body{fill:var(--yt-red)}.textlink .yt-ic .yt-play{fill:#fff}

/* ═══ 휴대폰 세로(≤600px): 브랜드·채널은 아래 브랜드 띠로, 위에는 제목 + 고정 세트 ═══ */
@media (max-width:600px){
  :root{--top-h:52px;--strip-h:40px}
  .topbar{padding:0 4px 0 12px;gap:6px}
  .topbar>.vdiv{display:none}
  .top-title .std{display:none}
  .top-title h1{font-size:15px}
  .brand{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--strip-h) + env(safe-area-inset-bottom));padding:0 12px env(safe-area-inset-bottom);background:var(--surface-1);border-top:1px solid var(--line-1);justify-content:flex-start}
  .brand .social{width:44px;height:36px}

  --ap-brass-0:#fff2c2;--ap-brass-1:#f0d27a;--ap-brass-2:#c49a28;--ap-brass-3:#6f530f;

:root[data-theme="light"]{

/* 힘의 3요소 — 장면 토큰(두 테마 같은 목록) · 몰입형 장면 + 오른쪽 조작 레일 */
:root[data-theme="dark"]{
  --force:#ff7b5c;--force-ink:#5a1a0e;--force-soft:#ff7b5c33;
  --wood-hi:#c99a63;--wood:#9c7348;--wood-lo:#5c4128;--grain:#b88a58;
  --wall-fill:#223244;--wall-hatch:#3f566e;--wall-edge:#4d6680;
  --arc:#36506a;--prot:#6f879e;--prot-text:#b0c0cf;--ghost:#9fb2c4;--peak:#ff7b5c;
  --metal-hi:#e3e8ee;--metal-lo:#56606b;--floor-label:#8ea2b4;
  --floor-room:#13202d;--floor-hall:#0f1a26;--floor-line:#1d2d3d;--floor-sill:#1a2836;
  --mat:#1b2b3c;--mat-edge:#36506a;--clip:#d7dee6;
}
:root[data-theme="light"]{
  --force:#cf3a1c;--force-ink:#ffffff;--force-soft:#cf3a1c26;
  --wood-hi:#d9b07c;--wood:#b3834f;--wood-lo:#7a5431;--grain:#c69763;
  --wall-fill:#dfe6ec;--wall-hatch:#98a8b7;--wall-edge:#8a9aab;
  --arc:#b7c6d3;--prot:#7d90a2;--prot-text:#44596b;--ghost:#6d8193;--peak:#cf3a1c;
  --metal-hi:#f4f7fa;--metal-lo:#5f6a76;--floor-label:#566b7e;
  --floor-room:#f3eee6;--floor-hall:#eef2f5;--floor-line:#e0d8cb;--floor-sill:#e4e8ec;
  --mat:#e6eef4;--mat-edge:#a9bccb;--clip:#4a5560;
}

/* 배치: 장면이 주인공, 레일 340px */
.lab{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.stage-wrap{position:relative;min-width:0;min-height:0;background:var(--stage);border-right:1px solid var(--line-1);overflow:hidden}
.stage{position:absolute;inset:0}
#scene,#sceneB{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#sceneB[hidden]{display:none}
.door-rail,.bal-rail{display:flex;flex-direction:column;gap:20px}
.door-rail[hidden],.bal-rail[hidden]{display:none}
/* 두 힘의 평형 장면 */
.b-desk{fill:var(--mat);stroke:var(--mat-edge);stroke-width:.6}
.b-grain{stroke:var(--mat-edge);stroke-width:.25;opacity:.45}
.b-house{fill:var(--metal-hi);stroke:var(--metal-lo);stroke-width:.5}
.b-win{fill:var(--stage);opacity:.85}
.b-tick{stroke:var(--prot-text);stroke-width:.35}
.b-num{fill:var(--prot-text);font-size:var(--t12);font-weight:600;text-anchor:middle;dominant-baseline:hanging}
.b-ptr{fill:var(--peak)}
.b-rod{stroke:var(--ap-m2);stroke-width:1.5}
.b-rod-in{stroke:var(--ap-m2);stroke-width:1.1}
.b-hook{fill:none;stroke:var(--ap-m2);stroke-width:1.2;stroke-linecap:round}
.b-ring{fill:none;stroke:var(--ap-m2);stroke-width:1.8}
.b-tube{fill:var(--mat-edge);opacity:.35}
.b-spring{fill:none;stroke:var(--ap-m3);stroke-width:.6;stroke-linejoin:round}
.b-clip-hi{stroke:#fff;stroke-width:.5;opacity:.5;stroke-linecap:round}
.b-hit{fill:transparent;cursor:ew-resize}
.b-hit:focus{outline:none}
.b-hit:focus-visible+.b-ring,.b-grip.dragging .b-ring{stroke:var(--accent)}
.b-clip{fill:none;stroke:var(--clip);stroke-width:1.3}
.b-clip-sh{fill:none;stroke:#000;stroke-width:1.2;opacity:.25}
.b-ghost{fill:none;stroke:var(--ghost);stroke-width:.6;stroke-dasharray:1.4 1.2}
.b-pin{fill:var(--accent);fill-opacity:.18;stroke:var(--accent);stroke-width:.9}
.b-pin-t{fill:var(--text-1);font-size:var(--t12);font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--mat);stroke-width:var(--h3,3px);stroke-linejoin:round}
.b-f{stroke:var(--force);stroke-width:1.8}.b-fh{fill:var(--force)}
.b-net{stroke:var(--text-1);stroke-width:1.8}.b-lead{stroke:var(--text-2);stroke-width:.5;stroke-dasharray:1.2 1}.b-neth{fill:var(--text-1)}
.b-ft{fill:var(--force);font-size:var(--t13);font-weight:800;paint-order:stroke;stroke:var(--mat);stroke-width:var(--h3,3px);stroke-linejoin:round;font-variant-numeric:tabular-nums}
.b-nt{fill:var(--text-1);font-size:var(--t13);font-weight:800;text-anchor:middle;dominant-baseline:hanging;paint-order:stroke;stroke:var(--mat);stroke-width:var(--h3,3px);stroke-linejoin:round;font-variant-numeric:tabular-nums}
.b-cap{fill:var(--text-2);font-size:var(--t12);font-weight:500}
.bsteps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bsteps li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;font:500 13px/1.5 var(--font-ui);color:var(--text-2)}
.bsteps li.on{color:var(--text-1)}
.bsteps .bk{width:18px;height:18px;margin-top:1px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--text-2);font:800 11px/1 var(--font-ui)}
.bsteps li.on .bk{background:var(--ok);border-color:var(--ok);color:var(--surface-1)}
.bsteps .bk svg{width:11px;height:11px;stroke-width:2.8}
.stage-tools{position:absolute;top:12px;right:12px;z-index:3}
.stage-note{position:absolute;left:14px;top:14px;z-index:2;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r-2);background:color-mix(in oklab,var(--stage) 86%,transparent);border:1px solid var(--line-1);font:500 13px/1.3 var(--font-ui);color:var(--text-2);pointer-events:none}
.stage-note .k{color:var(--text-1);font-weight:700}
.stage-note .dot{color:var(--line-2)}

/* 장면 SVG */
.wall-fill{fill:var(--wall-fill)}.wall-hatch{stroke:var(--wall-hatch);stroke-width:.7}
.wall{fill:url(#hatch);stroke:var(--wall-edge);stroke-width:.6}
.jamb{fill:var(--wall-edge)}
.wood-hi-stop{stop-color:var(--wood-hi)}.wood-stop{stop-color:var(--wood)}.wood-lo-stop{stop-color:var(--wood-lo)}
.metal-hi-stop{stop-color:var(--metal-hi)}.metal-lo-stop{stop-color:var(--metal-lo)}
.leaf{fill:url(#woodGrad);stroke:var(--wood-lo);stroke-width:.45}
.grain{stroke:var(--grain);stroke-width:.35;fill:none;opacity:.8}
.lever{fill:var(--metal-lo);stroke:none}
.lever-hi{fill:var(--metal-hi);opacity:.7}
.pivot{fill:url(#pivotGrad);stroke:var(--metal-lo);stroke-width:.5}
.pivot-dot{fill:var(--metal-lo)}
.floor-room{fill:var(--floor-room)}
.floor-hall{fill:var(--floor-hall)}
.floor-sill{fill:var(--floor-sill)}
.floor-line{fill:none;stroke:var(--floor-line);stroke-width:.35}
.floor-line.hall{stroke-width:.45}
.leaf-sh{fill:#000;opacity:.3}
.leaf-end{fill:var(--wood-lo);opacity:.8}
.swing{fill:none;stroke:var(--arc);stroke-width:.7;stroke-dasharray:2.4 2.2}
.ptick{stroke:var(--prot);stroke-width:.55}
.ptick.major{stroke-width:.9}
.ptext{fill:var(--prot-text);font-size:var(--t12);font-weight:500;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.ptext.start{text-anchor:start}
.room.end{text-anchor:end}
.room{fill:var(--floor-label);font-size:var(--t13);font-weight:700;letter-spacing:.02em}
.cap-s.end{text-anchor:end}
.cap-s{fill:var(--floor-label);font-size:var(--t12);font-weight:500}
.ghost-leaf{fill:none;stroke:var(--ghost);stroke-width:.7;stroke-dasharray:2 1.6;opacity:.85}
.ghost-t{text-anchor:middle;fill:var(--ghost);font-size:var(--t12);font-weight:600;dominant-baseline:central}
.peak-mark{stroke:var(--peak);stroke-width:1.6;stroke-linecap:round}
.peak-t{text-anchor:middle;fill:var(--force);font-size:var(--t15);font-weight:800;dominant-baseline:central;paint-order:stroke;stroke:var(--stage);stroke-width:var(--h3,3px);stroke-linejoin:round;font-variant-numeric:tabular-nums}
.ang-t{text-anchor:start;fill:var(--text-1);font-size:var(--t13);font-weight:700;dominant-baseline:central;paint-order:stroke;stroke:var(--stage);stroke-width:var(--h3,3px);stroke-linejoin:round;font-variant-numeric:tabular-nums}
/* 힘 화살표: ● 시작점(작용점) · 눈금 새긴 몸통(크기) · ▶ 머리(방향) */
.f-body{stroke:var(--force);stroke-width:3.1;stroke-linecap:butt;fill:none}
.f-tick{stroke:var(--force-ink);stroke-width:1.1}
.f-head{fill:var(--force)}
.f-dot{fill:var(--force);stroke:var(--stage);stroke-width:1.4}
.f-label{fill:var(--force);font-size:var(--t13);font-weight:800;paint-order:stroke;stroke:var(--stage);stroke-width:var(--h3,3px);stroke-linejoin:round;dominant-baseline:central;font-variant-numeric:tabular-nums}
.f-ring{fill:none;stroke:var(--force);stroke-width:.8;opacity:.55;stroke-dasharray:1.6 1.6}
.hit{fill:transparent;stroke:none;cursor:grab;outline:none}
.hit:active{cursor:grabbing}
.hit:focus-visible+.focus-ring,.handle:focus-visible .focus-ring{opacity:1}
.focus-ring{fill:none;stroke:var(--focus);stroke-width:1;opacity:0;pointer-events:none}
.handle{outline:none;cursor:grab}
.handle.dragging{cursor:grabbing}
.pushing .f-body{stroke-width:3.6}
.arrow-dim{opacity:.38}
#gArrow{transition:opacity var(--dur-ui) var(--ease-out)}
.door-hit{fill:transparent;cursor:pointer}

/* 레일 */
.rail{display:flex;flex-direction:column;min-height:0;background:var(--surface-1)}
.rail-head{padding:12px 16px;border-bottom:1px solid var(--line-1)}
.rail-head .seg{width:100%}
.rail-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:14px 16px 16px;display:flex;flex-direction:column;gap:20px}
.rail-foot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line-1);background:var(--surface-1)}
.rail-foot .grow{flex:1;min-height:44px;font-size:15px}
.rail-foot .ghost{min-height:44px}
.cap{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font:700 13px/1.4 var(--font-ui);color:var(--text-1);margin-bottom:6px}
.cap-note{font:500 12px/1.4 var(--font-ui);color:var(--text-2)}
.els{display:flex;flex-direction:column}
.el{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:52px;padding:4px 0;border-top:1px solid var(--line-1)}
.el:last-child{border-bottom:1px solid var(--line-1)}
.el .glyph{width:28px;height:16px}
.g-body{stroke:var(--force);stroke-width:3;fill:none}
.g-body.faint{opacity:.35}
.g-tick{stroke:var(--force-ink);stroke-width:1.4}
:root[data-theme="dark"] .g-tick{stroke:var(--surface-1)}
.g-dot,.g-head{fill:var(--force)}
.el-txt{display:flex;flex-direction:column;min-width:0}
.el-name{font:600 12px/1.3 var(--font-ui);color:var(--text-2)}
.el-val{font:700 15px/1.35 var(--font-ui);color:var(--text-1)}
.el.flash .el-val{animation:elflash .6s var(--ease-out)}
@keyframes elflash{0%{color:var(--force)}100%{color:var(--text-1)}}
.el.changed .glyph{filter:drop-shadow(0 0 0 transparent)}
.step{display:flex;gap:2px}
.icon-btn.sm{width:34px;height:34px;border:1px solid var(--line-1);background:var(--surface-1)}
.icon-btn.sm svg.ic{width:17px;height:17px}
.result{display:flex;flex-direction:column;gap:6px}
.res-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.result .readout .v{font-size:30px}
.result .readout .u{font-size:13px}
.prev{font:500 13px/1.4 var(--font-ui);color:var(--text-2);min-height:18px}
.change{font:400 15px/1.6 var(--font-ui);color:var(--text-1);min-height:48px}
.change b{font-weight:700}
.ghost-tog{min-height:28px;font-size:12px}
/* 문 퍼즐 목표 */
.goal:empty{display:none}
.goal{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:var(--r-2);background:var(--surface-2);border:1px solid var(--line-1)}
.goal .gt{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 12px/1 var(--font-ui);color:var(--text-2)}
.goal .dots{display:flex;gap:5px}
.goal .dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--text-2)}
.goal .dots i.on{background:var(--ok);border-color:var(--ok)}
.goal .dots i.cur{border-color:var(--text-1);box-shadow:0 0 0 2px color-mix(in oklab,var(--text-1) 25%,transparent)}
.goal .g-text{font:700 15px/1.5 var(--font-ui);color:var(--text-1)}
.goal .g-fb{font:500 13px/1.55 var(--font-ui);color:var(--text-1)}
.goal .g-fb.ok{color:var(--ok)}
.goal .g-fb.ok::before{content:'✓ ';font-weight:800}
.goal .g-row{display:flex;gap:6px;flex-wrap:wrap}
.goal .done-t{font:800 18px/1.4 var(--font-ui)}

/* ≤ 860px: 레일이 장면 아래로, 푸터는 sticky */
@media (max-width:860px){
  main.app{overflow:auto}
  .lab{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  .stage-wrap{aspect-ratio:256/272;max-height:62dvh;border-right:0;border-bottom:1px solid var(--line-1)}
  .rail-scroll{overflow:visible;gap:14px;padding:12px 16px}
  .rail-foot{position:sticky;bottom:0;z-index:5}
}
@media (max-width:600px){
  .stage-tools{top:8px;right:8px}
  .save-btn{width:44px;height:44px;padding:0;justify-content:center}
  .save-btn .save-l{display:none}
  .stage-note{font-size:12px;padding:4px 8px}
  .rail-head{padding:10px 12px}
  .rail-scroll{padding:10px 12px}
  .el{min-height:48px;gap:8px}
  .rail-foot{padding:10px 12px}
  .change{min-height:0}
  .result{order:-1}
  .goal{order:-2}
  .stage-note{left:8px;top:8px}
}

</style>

<script>
/* ═══════ 송쌤과학 중1 가상실험실 공통 껍데기 — 테마 · 전체화면 · 도움말 · 원리 카드 · 결과 저장 · 단축키 ═══════
   각 실험실은 SS.init({...})을 한 번 부른다. 채널 주소는 이 파일의 CHANNELS 한 곳에서만 정의한다. */
const SS = (() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const NS = 'http://www.w3.org/2000/svg';
  const CHANNELS = { yt: 'https://www.youtube.com/@songsamscience', ig: 'https://www.instagram.com/songsamscience/' };
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ICONS = {
    flask: '<path d="M9 3h6m-5 0v6L4.5 19A2 2 0 0 0 6.3 22h11.4a2 2 0 0 0 1.8-3L14 9V3M7.5 15h9"/>',
    book: '<path d="M12 6.6C10.4 5.1 7.9 4.5 3.5 4.5v14c4.4 0 6.9.6 8.5 2.1 1.6-1.5 4.1-2.1 8.5-2.1v-14c-4.4 0-6.9.6-8.5 2.1Z"/><path d="M12 6.6v14"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.3c-.7.4-1.2 1-1.2 1.8v.5"/><path d="M12 17.2h.01"/>',
    fsIn: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    fsOut: '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>',
    moon: '<path d="M20 14.6A8.2 8.2 0 1 1 9.4 4a6.6 6.6 0 0 0 10.6 10.6Z"/>',
    sun: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>',
    camera: '<path d="M3.5 8.5h3.2l1.8-3h7l1.8 3h3.2v11h-17Z"/><circle cx="12" cy="13.5" r="3.6"/>',
    x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    chev: '<path d="m9.5 6 6 6-6 6"/>',
    chevL: '<path d="m14.5 6-6 6 6 6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    minus: '<path d="M5 12h14"/>',
    trash: '<path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/>',
    reset: '<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9"/><path d="M4.5 4.5V9H9"/>',
    undo: '<path d="M9 8H5V4"/><path d="M5.3 8A8 8 0 1 1 5 15"/>',
    play: '<path d="M7.5 5.5v13l11-6.5Z"/>',
    pause: '<path d="M8 5.5v13M16 5.5v13"/>',
    pen: '<path d="M4.5 19.5h4l10-10-4-4-10 10Z"/><path d="m13 7 4 4"/>',
    push: '<path d="M3.5 12h11"/><path d="m10.5 7 5 5-5 5"/><path d="M19.5 4.5v15"/>',
    target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.6"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>',
    ghost: '<circle cx="14" cy="11" r="7"/><circle cx="9.5" cy="13.5" r="5.2" stroke-dasharray="2.4 2.2"/>',
    record: '<path d="M5 4.5h10.5l3.5 3.5v11.5H5Z"/><path d="M8.5 11h7M8.5 14.5h7M8.5 7.5h4"/>',
    compare: '<path d="M12 3.5v17"/><rect x="3.5" y="6.5" width="6" height="11" rx="1.5"/><rect x="14.5" y="6.5" width="6" height="11" rx="1.5"/>',
    yt: '<path class="yt-body" d="M21.6 7.2a2.6 2.6 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4a2.6 2.6 0 0 0-1.8 1.8A27 27 0 0 0 2 12a27 27 0 0 0 .4 4.8 2.6 2.6 0 0 0 1.8 1.8c1.6.4 7.8.4 7.8.4s6.2 0 7.8-.4a2.6 2.6 0 0 0 1.8-1.8A27 27 0 0 0 22 12a27 27 0 0 0-.4-4.8Z"/><path class="yt-play" d="M10 15.3V8.7l5.6 3.3Z"/>',
    ig: '<rect class="ig-line" x="3" y="3" width="18" height="18" rx="5.2"/><circle class="ig-line" cx="12" cy="12" r="4.1"/><circle class="ig-dot" cx="17.4" cy="6.6" r="1.2"/>',
  };
  const icon = (name, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICONS[name] || ''}</svg>`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let CFG = null;
  const themeHooks = [];

  /* ── 저장: 진행 상태는 sessionStorage, 테마·익명 최고 기록만 localStorage ── */
  const KEY = n => `ssv-${CFG.id}-${n}`;
  const store = {
    get(n, d) { try { const v = sessionStorage.getItem(KEY(n)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(n, v) { try { sessionStorage.setItem(KEY(n), JSON.stringify(v)); } catch (e) { } },
    del(n) { try { sessionStorage.removeItem(KEY(n)); } catch (e) { } },
    clear() { try { Object.keys(sessionStorage).filter(k => k.startsWith(`ssv-${CFG.id}-`)).forEach(k => sessionStorage.removeItem(k)); } catch (e) { } },
  };

  /* ── 알림 ── */
  function announce(m) { const l = $('#live'); if (!l) return; l.textContent = ''; requestAnimationFrame(() => { l.textContent = m; }); }
  let toastT = 0, toastLast = '', toastN = 1;
  function toast(msg, o = {}) {
    const e = $('#toast');
    if (msg === toastLast && !e.hidden) toastN++; else toastN = 1;
    toastLast = msg;
    e.innerHTML = `<span>${esc(msg)}${toastN > 1 ? ` <b class="num">×${toastN}</b>` : ''}</span>${o.error ? `<button class="toast-x" aria-label="알림 닫기">${icon('x')}</button>` : ''}`;
    e.classList.toggle('error', !!o.error);
    e.hidden = false;
    const x = e.querySelector('.toast-x'); if (x) x.onclick = () => { e.hidden = true; };
    clearTimeout(toastT);
    toastT = setTimeout(() => { e.hidden = true; }, o.error ? 7000 : 2800);
  }

  /* ── 테마 (§11 — 스위치는 html[data-theme] 하나) ── */
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('ssv-theme', t); } catch (e) { }
    const next = t === 'dark' ? '라이트' : '다크', b = $('#themeBtn');
    b.setAttribute('aria-label', `${next} 모드로 전환 (D)`); b.setAttribute('title', `${next} 모드로 전환 (D)`);
    b.innerHTML = icon(t === 'dark' ? 'moon' : 'sun');
    const mt = $('#metaTheme'); if (mt) mt.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--surface-1').trim());
    themeHooks.forEach(f => f(t));
  }
  const toggleTheme = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

  /* ── 전체화면 ── */
  function toggleFull() {
    const d = document;
    if (d.fullscreenElement) { d.exitFullscreen && d.exitFullscreen(); return; }
    const r = d.documentElement;
    if (!r.requestFullscreen || d.fullscreenEnabled === false) { toast('이 브라우저에서는 전체화면을 지원하지 않습니다', { error: true }); return; }
    r.requestFullscreen().catch(() => toast('전체화면으로 바꾸지 못했어요. 다시 눌러 보세요.', { error: true }));
  }
  function syncFull() {
    const on = !!document.fullscreenElement, b = $('#fullBtn');
    document.body.classList.toggle('fs', on);
    b.innerHTML = icon(on ? 'fsOut' : 'fsIn');
    const l = on ? '전체화면 나가기 (F · Esc)' : '전체화면 (F)';
    b.setAttribute('aria-label', l); b.setAttribute('title', l);
  }

  /* ── 대화상자 (네이티브 <dialog>) ── */
  let lastTrigger = null;
  function openModal(title, html, o = {}) {
    const d = $('#modal');
    if (d.open) d.close();
    lastTrigger = document.activeElement;
    d.classList.toggle('narrow', !!o.narrow);
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = html;
    d.showModal();
    if (o.onOpen) o.onOpen(d);
    $('#modalBody').scrollTop = 0;
  }
  function openDrawer() {
    const d = $('#drawer');
    lastTrigger = document.activeElement;
    $('#drawerBody').innerHTML = CFG.theory();
    d.showModal();
    $('#drawerBody').scrollTop = 0;
    if (CFG.onTheoryOpen) CFG.onTheoryOpen($('#drawerBody'));
  }
  function openHelp() {
    const h = CFG.help;
    openModal('도움말', `<div class="help-doc">
      <h3>이렇게 해 보세요</h3>${h.how}
      <h3>단축키</h3><p class="keys"><kbd>F</kbd> 전체화면 · <kbd>D</kbd> 다크/라이트 · <kbd>H</kbd> 도움말 · <kbd>C</kbd> 결과 저장 · <kbd>Esc</kbd> 창 닫기·전체화면 나가기${h.keys ? '<br>' + h.keys : ''}</p>
      <h3>결과 저장</h3><p>장면 오른쪽 위 <b>결과 저장</b>(또는 <kbd>C</kbd>)을 누르면 지금 보이는 장면과 그 순간의 조건·값이 담긴 PNG 한 장이 기기의 다운로드 폴더에 저장돼요(iPad는 저장 확인 창이 떠요).</p>
      <h3>모형의 조건과 한계</h3>${h.model}
      <h3>출처와 제작</h3>${h.source}
      <h3>기록 지우기</h3><p>실험 기록과 진행 상태는 이 탭에만 남고, 탭을 닫으면 지워져요.${h.local ? ' ' + h.local : ''}</p>
      <button class="btn" id="wipeBtn">${icon('trash')}이 실험실의 기록 모두 지우기</button>
      <div class="brandblock">🧪 송쌤과학 (Song Ssaem Science)<br>ⓒ 2026 송세호 | 아주중학교<br>📺 YouTube: <a href="${CHANNELS.yt}" target="_blank" rel="noopener noreferrer" aria-label="송쌤과학 유튜브 채널 (새 창)">@songsamscience</a>&nbsp; 📷 Instagram: <a href="${CHANNELS.ig}" target="_blank" rel="noopener noreferrer" aria-label="송쌤과학 인스타그램 (새 창)">@songsamscience</a><br>⚠ 무단 복제·상업적 이용 금지</div>

    <li>힘은 0.4초 동안 같은 크기·같은 방향으로 작용한다고 가정했어요. 크기는 5 N, 방향은 15°, 작용점은 5 cm 간격으로 골라요.</li>
    <li>화살표 길이는 힘의 크기를 나타내요(한 칸 = 10 N). 문 그림의 길이(cm)와는 다른 눈금이에요.</li>
    <li>문이 열리는 각도는 힘의 크기, 경첩에서 작용점까지의 거리, 문과 이루는 방향으로 계산한 모형 값이에요. 실제 문은 무게와 경첩에 따라 값이 달라요.</li>
    <li>두 힘의 평형: 용수철저울은 1 N마다 6 mm 늘어나고, 양쪽 고리는 손으로 잡고 있어 움직이지 않아요. 클립과 책상 사이의 마찰은 없다고 보았어요. 그래서 클립은 두 저울의 힘이 같아지는 곳(가운데)까지 움직여 멈춰요.</li></ul>`,
  source: '<p>2022 개정 중학교 과학 ‘힘의 작용’ — [9과05-01] 물체에 작용하는 힘을 화살표를 이용하여 나타내고, 힘의 평형을 이루는 조건을 설명할 수 있다.</p><p>중학교 과학 교과서의 정의·용어(힘의 작용점·방향·크기, 합력·알짜힘, 힘의 평형)와 탐구 활동을 바탕으로 만들었고, 그림은 모두 새로 그렸어요. 이전 판(세 칸 인포그래픽)을 한 장면으로 다시 만들었어요.</p>',
  wipe: '화살표 설정, 직전 결과, 문 퍼즐 진행, 두 힘의 평형 설정',
};

/* ═════════ 이벤트 · 시작 ═════════ */
function capture() {
  if (mode === 'bal') {
    const f = bForce(), net = f.R - f.L;
    return { svg: svgB, flashEl: $('#stage'), title: '힘의 3요소 — 두 힘의 평형',
      cond: `용수철저울 2개로 클립 당기기 · ${bclip.pinned ? '클립을 누르는 중' : '클립을 놓음'}${bclip.f0 && !bclip.pinned ? ` · 놓기 전 왼쪽 ${f1b(bclip.f0.L)} N, 오른쪽 ${f1b(bclip.f0.R)} N` : ''}`,
      state: `지금 왼쪽 ${f1b(f.L)} N · 오른쪽 ${f1b(f.R)} N → 합력 ${f1b(Math.abs(net))} N${Math.abs(net) < .05 ? '(평형)' : net > 0 ? '(오른쪽)' : '(왼쪽)'}` };
  }
  const last = hist[hist.length - 1];
  return {
    svg, flashEl: $('#stage'),
    cond: `작용점 ${pointText(A)} · 크기 ${A.F} N · 방향 ${dirInfo(A).text}`,
    state: last ? `최근 시도: ${last.A.F} N, ${pointText(last.A)}, ${dirInfo(last.A).text.split(' · ')[0]} → 문이 열린 최대 각도 ${peakText(last.peak).v} (${peakText(last.peak).side})${hist.length >= 2 ? ` · 직전 ${peakText(hist[0].peak).v}` : ''}` : '아직 문을 밀지 않았어요',
  };
}
function bind() {
  $('#pushBtn').innerHTML = `${icon('push')}문 밀기`;
  $('#resetBtn').innerHTML = `${icon('reset')}처음 화살표로`;
  $('[data-act="point-"]').innerHTML = icon('chevL'); $('[data-act="point+"]').innerHTML = icon('chev');
  $('[data-act="mag-"]').innerHTML = icon('minus'); $('[data-act="mag+"]').innerHTML = icon('plus');
  $('[data-act="dir+"]').innerHTML = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2-5"/><path d="M5 3.5V8h4.5"/></svg>';
  $('[data-act="dir-"]').innerHTML = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2-5"/><path d="M19 3.5V8h-4.5"/></svg>';
  $('#pushBtn').addEventListener('click', () => mode === 'bal' ? releaseClip() : push());
  $('#balRail').addEventListener('click', e => { const b = e.target.closest('[data-bal]'); if (!b || b.disabled) return; const k = b.dataset.bal; setBal(k[0], (k[0] === 'L' ? BAL.FL : BAL.FR) + (k[1] === '+' ? .5 : -.5)); });
  $$('[data-bal$="-"]').forEach(b => b.innerHTML = icon('minus')); $$('[data-bal$="+"]').forEach(b => b.innerHTML = icon('plus'));
  $('#resetBtn').addEventListener('click', () => {
    if (mode === 'bal') { BAL = { FL: 2, FR: 4, steps: BAL.steps }; bclip.x = B_XC; bclip.v = 0; bclip.pinned = true; bclip.moving = false; bclip.start = null; bMsg = ''; bSetRings(); saveBal(); renderB(); syncRail(); announce('저울과 클립을 처음 상태로 돌렸어요'); return; }
    A = A0(); hist = []; door.th = 0; door.om = 0; door.running = false; door.reported = true; fb = null;
    save(); syncRail(); renderResult(); renderGoal(); render(); announce('화살표를 처음 상태로 돌렸어요. 퍼즐 진행은 그대로예요.');
  });
  $('#ghostTog').addEventListener('click', () => { showGhost = !showGhost; save(); syncRail(); render(); });
  $('#modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.v; fb = null; save(); syncRail(); renderGoal(); if (mode === 'bal') sizeB(); else sizeText(); });
  $('#lab').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a.startsWith('point') || a.startsWith('mag') || a.startsWith('dir')) {
      if (!canEdit()) return;
      const d = a.endsWith('+') ? 1 : -1;
      if (a.startsWith('point')) setA({ r: clamp(A.r + d * RR.step, RR.min, RR.max) }, 'point');
      if (a.startsWith('mag')) setA({ F: clamp(A.F + d * FR.step, FR.min, FR.max) }, 'mag');
      if (a.startsWith('dir')) setA({ dir: norm(A.dir + d * DIR_STEP) }, 'dir');
      return;
    }
    if (a === 'qprev') { qi = Math.max(0, qi - 1); fb = null; save(); renderGoal(); }
    if (a === 'qnext') { qi = Math.min(PUZ.length - 1, qi + 1); fb = null; save(); renderGoal(); }
    if (a === 'qagain') { solved = [false, false, false]; qi = 0; fb = null; save(); renderGoal(); syncRail(); }
    if (a === 'qfree') { mode = 'free'; save(); syncRail(); renderGoal(); }
  });
}
buildStatic(); bind();
SS.init({
  id: 'three-force', title: '힘의 3요소', file: '힘의3요소', version: APP_VERSION, date: APP_DATE,
  help: HELP, theory, capture,
  onResize: () => { sizeText(); sizeB(); },
  onKey: e => { if (e.key === 'Enter' && e.target === document.body) { e.preventDefault(); mode === 'bal' ? releaseClip() : push(); } },
  onWipe: () => { BAL = { FL: 2, FR: 4, steps: {} }; bclip.x = B_XC; bclip.v = 0; bclip.pinned = true; bclip.moving = false; bclip.start = null; bMsg = ''; bSetRings(); A = A0(); hist = []; mode = 'free'; solved = [false, false, false]; qi = 0; fb = null; showGhost = true; door.th = 0; door.om = 0; door.running = false; door.reported = true; syncRail(); renderResult(); renderGoal(); render(); },
});
syncRail(); renderResult(); renderGoal(); sizeText();
buildB(); sizeB();
SS.loop(dt => { step(dt); stepB(dt); });
window.ThreeForce = { bal: { setBal, releaseClip, stepB, state: () => ({ BAL, bclip: { ...bclip }, f: bForce() }) }, A, door, hist: () => hist, push, step, setA, render, PUZ, state: () => ({ A, door: { ...door }, hist, mode, solved, qi }) };

</script>
